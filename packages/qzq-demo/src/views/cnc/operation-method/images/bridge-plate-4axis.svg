<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d3139"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="part3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="flange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>

  <g stroke="#3a3f4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="600">4-Axis Bridge Plate · 找回转中心</text>
  <text x="400" y="62" text-anchor="middle" fill="#9ca3af" font-size="12">4 轴桥板装夹示意图</text>

  <!-- A-axis flange (front view) -->
  <g transform="translate(400, 300)">
    <!-- flange -->
    <circle r="140" fill="url(#flange)" stroke="#1f2937" stroke-width="3"/>
    <circle r="125" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- bolt holes -->
    <g fill="#1f2937">
      <circle cx="-110" cy="0" r="8"/>
      <circle cx="110" cy="0" r="8"/>
      <circle cx="0" cy="-110" r="8"/>
      <circle cx="0" cy="110" r="8"/>
      <circle cx="-78" cy="-78" r="7"/>
      <circle cx="78" cy="-78" r="7"/>
      <circle cx="-78" cy="78" r="7"/>
      <circle cx="78" cy="78" r="7"/>
    </g>

    <!-- center -->
    <circle r="30" fill="#1f2937"/>
    <circle r="15" fill="#111827"/>

    <!-- A axis marker -->
    <circle r="100" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 100 0 A 100 100 0 0 1 70 -70" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrC)"/>
    <text x="110" y="-60" fill="#3b82f6" font-size="12" font-weight="600">A轴</text>
  </g>

  <!-- Bridge plate -->
  <g transform="translate(280, 180)">
    <!-- plate body -->
    <rect x="0" y="0" width="240" height="30" rx="2" fill="url(#bridge)" stroke="#57534e" stroke-width="1"/>
    <!-- bolt -->
    <rect x="20" y="-6" width="16" height="6" fill="#9ca3af"/>
    <rect x="108" y="-6" width="16" height="6" fill="#9ca3af"/>
    <rect x="204" y="-6" width="16" height="6" fill="#9ca3af"/>
  </g>

  <!-- Workpiece on bridge plate (A=0° side view) -->
  <g transform="translate(300, 210)">
    <rect x="0" y="-70" width="200" height="60" rx="2" fill="url(#part3)" stroke="#0284c7" stroke-width="1"/>
    <!-- top face (benchmark surface) -->
    <rect x="0" y="-70" width="200" height="8" rx="1" fill="#38bdf8"/>
    <!-- side face (benchmark edge) -->
    <rect x="0" y="-70" width="6" height="60" rx="1" fill="#10b981"/>

    <!-- clamping bolts -->
    <g fill="#6b7280">
      <rect x="10" y="-78" width="8" height="10"/>
      <rect x="182" y="-78" width="8" height="10"/>
    </g>
  </g>

  <!-- Edge finder indicator -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <circle cx="11" cy="8" r="4" fill="#374151"/>
    <line x1="22" y1="8" x2="120" y2="-40" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="100" y="-48" fill="#9ca3af" font-size="10">寻边器</text>
  </g>

  <!-- Dimension lines -->
  <g>
    <!-- Y distance -->
    <line x1="180" y1="420" x2="540" y2="420" stroke="#60a5fa" stroke-width="1.5"/>
    <polygon points="180,420 186,416 186,424" fill="#60a5fa"/>
    <polygon points="540,420 534,416 534,424" fill="#60a5fa"/>
    <text x="360" y="410" text-anchor="middle" fill="#60a5fa" font-size="12">|Y₁ - Y₂| = 2R</text>

    <!-- Y1 Y2 -->
    <circle cx="180" cy="420" r="4" fill="#ef4444"/>
    <text x="170" y="440" text-anchor="end" fill="#ef4444" font-size="10">Y₁</text>
    <circle cx="540" cy="420" r="4" fill="#ef4444"/>
    <text x="550" y="440" fill="#ef4444" font-size="10">Y₂</text>

    <!-- Z -->
    <line x1="700" y1="120" x2="700" y2="380" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="700,120 696,126 704,126" fill="#10b981"/>
    <polygon points="700,380 696,374 704,374" fill="#10b981"/>
    <text x="712" y="260" fill="#10b981" font-size="12">H</text>
  </g>

  <!-- Coordinate system -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="2"/>
    <polygon points="50,0 44,-4 44,4" fill="#ef4444"/>
    <text x="55" y="4" fill="#ef4444" font-size="13" font-weight="600">XC</text>

    <line x1="0" y1="0" x2="0" y2="-45" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-45 -4,-39 4,-39" fill="#10b981"/>
    <text x="-18" y="-48" fill="#10b981" font-size="13" font-weight="600">ZC</text>

    <line x1="0" y1="0" x2="-35" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="-35,25 -29,21 -31,29" fill="#3b82f6"/>
    <text x="-55" y="32" fill="#3b82f6" font-size="13" font-weight="600">YC</text>

    <circle cx="0" cy="0" r="3" fill="#e5e7eb"/>
    <text x="0" y="20" text-anchor="middle" fill="#9ca3af" font-size="10">G54</text>
  </g>

  <!-- Legend -->
  <g transform="translate(400, 500)" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="url(#bridge)" rx="1"/>
    <text x="20" y="11" fill="#d1d5db">桥板</text>

    <rect x="80" y="0" width="14" height="14" fill="url(#part3)" rx="1"/>
    <text x="100" y="11" fill="#d1d5db">工件</text>

    <rect x="180" y="0" width="14" height="14" fill="#10b981" rx="1"/>
    <text x="200" y="11" fill="#d1d5db">基准面</text>

    <rect x="280" y="0" width="14" height="14" fill="url(#flange)" rx="1"/>
    <text x="300" y="11" fill="#d1d5db">A 轴法兰</text>
  </g>

  <defs>
    <marker id="arrC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>