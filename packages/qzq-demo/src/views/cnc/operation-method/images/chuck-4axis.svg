<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d3139"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="chuck" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>

  <g stroke="#3a3f4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="600">4-Axis 3-Jaw Chuck · 找 A 轴旋转中心</text>
  <text x="400" y="62" text-anchor="middle" fill="#9ca3af" font-size="12">4 轴三爪夹圆柱料示意图</text>

  <!-- Rotary table base -->
  <g transform="translate(80, 230)">
    <rect x="0" y="130" width="280" height="30" rx="4" fill="url(#metal2)"/>

    <!-- rotary table disc -->
    <circle cx="140" cy="130" r="90" fill="url(#metal2)" stroke="#4b5563" stroke-width="2"/>
    <circle cx="140" cy="130" r="75" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- A axis arrow -->
    <circle cx="140" cy="130" r="40" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 180 130 A 40 40 0 0 1 170 100" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
    <text x="190" y="100" fill="#3b82f6" font-size="12" font-weight="600">A轴</text>

    <!-- 3-jaw chuck -->
    <g transform="translate(140, 130)">
      <circle r="32" fill="url(#chuck)" stroke="#1f2937" stroke-width="2"/>
      <circle r="18" fill="#1f2937"/>

      <!-- jaws -->
      <g fill="#9ca3af" stroke="#374151" stroke-width="1">
        <polygon points="-28,-6 -38,0 -28,6 -20,4 -20,-4"/>
        <polygon points="28,-6 38,0 28,6 20,4 20,-4"/>
        <polygon points="-6,-28 0,-38 6,-28 4,-20 -4,-20"/>
      </g>

      <!-- center hole -->
      <circle r="10" fill="#111827"/>
    </g>
  </g>

  <!-- Yellow cylindrical bar (isometric) -->
  <g transform="translate(330, 260)">
    <!-- bar main body -->
    <rect x="0" y="0" width="240" height="80" fill="url(#bar)"/>
    <!-- top ellipse -->
    <ellipse cx="0" cy="0" rx="12" ry="40" fill="#fde68a"/>
    <ellipse cx="0" cy="0" rx="6" ry="20" fill="#78350f"/>
    <!-- bottom ellipse -->
    <ellipse cx="0" cy="80" rx="12" ry="40" fill="#92400e"/>
    <!-- front circle -->
    <circle cx="240" cy="40" r="40" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
    <circle cx="240" cy="40" r="25" fill="#b45309"/>
    <circle cx="240" cy="40" r="15" fill="#78350f"/>

    <!-- machined flat (top-right surface after milling) -->
    <rect x="180" y="0" width="60" height="80" fill="#1f2937" opacity="0.7" stroke="#10b981" stroke-width="1"/>
    <line x1="180" y1="0" x2="240" y2="40" stroke="#10b981" stroke-width="1.5"/>
    <line x1="180" y1="80" x2="240" y2="40" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Spindle with edge finder -->
  <g transform="translate(600, 180)">
    <rect x="0" y="0" width="40" height="100" rx="3" fill="#4b5563"/>
    <rect x="10" y="100" width="20" height="50" fill="#6b7280"/>
    <!-- edge finder -->
    <circle cx="20" cy="160" r="10" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
    <circle cx="20" cy="160" r="3" fill="#374151"/>
  </g>

  <!-- Y1/Y2 distance markers -->
  <g>
    <line x1="400" y1="330" x2="400" y2="400" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="560" y1="330" x2="560" y2="400" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,2"/>

    <line x1="400" y1="360" x2="560" y2="360" stroke="#60a5fa" stroke-width="1.5"/>
    <polygon points="400,360 406,356 406,364" fill="#60a5fa"/>
    <polygon points="560,360 554,356 554,364" fill="#60a5fa"/>
    <text x="480" y="355" text-anchor="middle" fill="#60a5fa" font-size="11">|Y₁ - Y₂|</text>
    <text x="480" y="395" text-anchor="middle" fill="#9ca3af" font-size="10">R = ÷ 2</text>

    <!-- points Y1 Y2 -->
    <circle cx="400" cy="330" r="4" fill="#ef4444"/>
    <text x="390" y="325" text-anchor="end" fill="#ef4444" font-size="10">Y₁</text>
    <circle cx="560" cy="330" r="4" fill="#ef4444"/>
    <text x="570" y="325" fill="#ef4444" font-size="10">Y₂</text>

    <!-- rotation center -->
    <circle cx="480" cy="295" r="6" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="480" y1="290" x2="480" y2="260" stroke="#10b981" stroke-width="1.5"/>
    <text x="490" y="255" fill="#10b981" font-size="11" font-weight="600">A 轴旋转中心</text>
  </g>

  <!-- Coordinate system -->
  <g transform="translate(700, 520)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="2"/>
    <polygon points="50,0 44,-4 44,4" fill="#ef4444"/>
    <text x="55" y="4" fill="#ef4444" font-size="13" font-weight="600">XC</text>

    <line x1="0" y1="0" x2="0" y2="-45" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-45 -4,-39 4,-39" fill="#10b981"/>
    <text x="-18" y="-48" fill="#10b981" font-size="13" font-weight="600">ZC</text>

    <line x1="0" y1="0" x2="-35" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="-35,25 -29,21 -31,29" fill="#3b82f6"/>
    <text x="-55" y="32" fill="#3b82f6" font-size="13" font-weight="600">YC</text>

    <circle cx="0" cy="0" r="3" fill="#e5e7eb"/>
    <text x="0" y="20" text-anchor="middle" fill="#9ca3af" font-size="10">G54</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 490)" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="url(#bar)" rx="1"/>
    <text x="20" y="11" fill="#d1d5db">圆柱棒料</text>

    <rect x="120" y="0" width="14" height="14" fill="#4b5563" rx="1"/>
    <text x="140" y="11" fill="#d1d5db">3 爪卡盘</text>

    <circle cx="277" cy="7" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="290" y="11" fill="#d1d5db">A 轴旋转方向</text>
  </g>

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>