<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d3139"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="part2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#3a3f4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Title top -->
  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="600">3-Axis Vise · 一夹 / 二夹翻面</text>
  <text x="400" y="62" text-anchor="middle" fill="#9ca3af" font-size="12">3 轴虎钳翻面装夹示意图</text>

  <!-- ========== TOP: 一夹 ========== -->
  <g transform="translate(60, 90)">
    <!-- machine base -->
    <rect x="0" y="120" width="300" height="30" rx="4" fill="url(#metal2)"/>
    <!-- vise body -->
    <rect x="60" y="70" width="180" height="50" rx="3" fill="url(#metal)"/>
    <!-- fixed jaw -->
    <rect x="55" y="55" width="18" height="75" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <!-- movable jaw -->
    <rect x="227" y="55" width="18" height="75" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <!-- screw -->
    <line x1="245" y1="95" x2="275" y2="95" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
    <circle cx="275" cy="95" r="6" fill="#4b5563"/>

    <!-- raw workpiece -->
    <rect x="73" y="40" width="154" height="30" rx="2" fill="url(#part)" stroke="#d97706" stroke-width="1"/>
    <rect x="73" y="40" width="154" height="8" rx="1" fill="#fbbf24" opacity="0.5"/>

    <!-- machined face marker -->
    <rect x="227" y="40" width="4" height="30" fill="#10b981"/>
    <text x="255" y="56" fill="#10b981" font-size="10">已加工基准面</text>

    <!-- spindle -->
    <rect x="140" y="-40" width="40" height="80" rx="3" fill="#4b5563"/>
    <rect x="150" y="40" width="20" height="50" fill="#6b7280"/>
    <polygon points="145,90 175,90 160,105" fill="#9ca3af"/>

    <!-- dimension arrow top -->
    <line x1="140" y1="5" x2="140" y2="40" stroke="#60a5fa" stroke-width="1.5" marker-start="url(#arrU)" marker-end="url(#arrD)"/>
    <text x="132" y="28" fill="#60a5fa" font-size="9" text-anchor="end">Z0</text>
  </g>

  <!-- ========== BOTTOM: 二夹 翻面 ========== -->
  <g transform="translate(440, 90)">
    <!-- machine base -->
    <rect x="0" y="120" width="300" height="30" rx="4" fill="url(#metal2)"/>
    <!-- vise body -->
    <rect x="60" y="70" width="180" height="50" rx="3" fill="url(#metal)"/>
    <!-- fixed jaw -->
    <rect x="55" y="55" width="18" height="75" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <!-- movable jaw -->
    <rect x="227" y="55" width="18" height="75" rx="2" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <!-- screw -->
    <line x1="245" y1="95" x2="275" y2="95" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
    <circle cx="275" cy="95" r="6" fill="#4b5563"/>

    <!-- flipped semi-finished -->
    <rect x="73" y="50" width="154" height="20" rx="2" fill="url(#part2)" stroke="#f59e0b" stroke-width="1"/>
    <!-- previously machined face now at bottom -->
    <rect x="73" y="65" width="154" height="5" rx="1" fill="#10b981"/>

    <!-- dial indicator -->
    <g transform="translate(120,-30)">
      <rect x="0" y="0" width="30" height="22" rx="3" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
      <circle cx="15" cy="11" r="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.5"/>
      <line x1="15" y1="11" x2="20" y2="7" stroke="#ef4444" stroke-width="1"/>
      <line x1="30" y1="22" x2="35" y2="55" stroke="#9ca3af" stroke-width="1.5"/>
      <line x1="35" y1="55" x2="150" y2="55" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
    </g>
  </g>

  <!-- label top -->
  <text x="210" y="265" text-anchor="middle" fill="#9ca3af" font-size="13">① 一夹 · 第一面加工</text>
  <text x="590" y="265" text-anchor="middle" fill="#9ca3af" font-size="13">② 二夹 · 翻面二次装夹</text>

  <!-- dimension bracket -->
  <g stroke="#ef4444" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 395 30 Q 405 30 405 40 Q 405 50 395 50"/>
  </g>
  <line x1="405" y1="40" x2="405" y2="140" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="415" y="100" fill="#ef4444" font-size="11">Z 落差 H</text>

  <!-- ====== Coordinate system (bottom right) ====== -->
  <g transform="translate(700, 520)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="2"/>
    <polygon points="50,0 44,-4 44,4" fill="#ef4444"/>
    <text x="55" y="4" fill="#ef4444" font-size="13" font-weight="600">XC</text>

    <line x1="0" y1="0" x2="0" y2="-45" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-45 -4,-39 4,-39" fill="#10b981"/>
    <text x="-18" y="-48" fill="#10b981" font-size="13" font-weight="600">ZC</text>

    <line x1="0" y1="0" x2="-35" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="-35,25 -29,21 -31,29" fill="#3b82f6"/>
    <text x="-55" y="32" fill="#3b82f6" font-size="13" font-weight="600">YC</text>

    <circle cx="0" cy="0" r="3" fill="#e5e7eb"/>
    <text x="0" y="20" text-anchor="middle" fill="#9ca3af" font-size="10">G54</text>
  </g>

  <!-- ====== Legend bottom left ====== -->
  <g transform="translate(40, 490)" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="url(#part)" rx="1"/>
    <text x="20" y="11" fill="#d1d5db">毛坯 / 半成品</text>

    <rect x="120" y="0" width="14" height="14" fill="#10b981" rx="1"/>
    <text x="140" y="11" fill="#d1d5db">已加工基准面</text>

    <rect x="260" y="0" width="14" height="14" fill="#e5e7eb" stroke="#374151" rx="1"/>
    <text x="280" y="11" fill="#d1d5db">寻边器 / 百分表</text>
  </g>

  <!-- arrow markers -->
  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 5 10 L 10 0 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 Z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>