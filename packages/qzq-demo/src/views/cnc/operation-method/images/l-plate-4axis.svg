<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d3139"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="lplate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="part4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <radialGradient id="flange2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg4)"/>

  <g stroke="#3a3f4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <text x="400" y="40" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="600">4-Axis L-Plate · 悬空立装</text>
  <text x="400" y="62" text-anchor="middle" fill="#9ca3af" font-size="12">4 轴 L 板（角板）装夹示意图</text>

  <!-- A-axis flange -->
  <g transform="translate(400, 340)">
    <circle r="100" fill="url(#flange2)" stroke="#1f2937" stroke-width="3"/>
    <circle r="85" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>

    <g fill="#1f2937">
      <circle cx="-75" cy="0" r="6"/>
      <circle cx="75" cy="0" r="6"/>
      <circle cx="0" cy="-75" r="6"/>
      <circle cx="0" cy="75" r="6"/>
    </g>

    <circle r="22" fill="#1f2937"/>
    <circle r="10" fill="#111827"/>

    <circle r="70" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 70 0 A 70 70 0 0 1 50 -50" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrD)"/>
    <text x="78" y="-40" fill="#3b82f6" font-size="11" font-weight="600">A轴</text>
  </g>

  <!-- L plate -->
  <g transform="translate(280, 120)">
    <!-- horizontal arm -->
    <rect x="0" y="80" width="140" height="25" rx="2" fill="url(#lplate)" stroke="#3f3f46" stroke-width="1"/>
    <!-- vertical arm -->
    <rect x="0" y="0" width="25" height="105" rx="2" fill="url(#lplate)" stroke="#3f3f46" stroke-width="1"/>
    <!-- corner rib -->
    <polygon points="0,80 25,80 25,105 0,105" fill="#18181b"/>
    <!-- bolt holes -->
    <circle cx="20" cy="14" r="4" fill="#111827"/>
    <circle cx="20" cy="40" r="4" fill="#111827"/>
    <circle cx="20" cy="66" r="4" fill="#111827"/>
  </g>

  <!-- Workpiece clamped on L-plate vertical face -->
  <g transform="translate(305, 130)">
    <!-- workpiece body -->
    <rect x="0" y="0" width="100" height="130" rx="2" fill="url(#part4)" stroke="#db2777" stroke-width="1"/>
    <!-- benchmark face -->
    <rect x="100" y="10" width="5" height="110" fill="#10b981"/>
    <rect x="0" y="0" width="100" height="5" fill="#38bdf8"/>
    <!-- clamping screw -->
    <rect x="40" y="128" width="20" height="10" fill="#9ca3af"/>
    <!-- hole detail -->
    <circle cx="30" cy="50" r="8" fill="#111827"/>
    <circle cx="70" cy="90" r="6" fill="#111827"/>

    <text x="108" y="70" fill="#10b981" font-size="10">基准面</text>
  </g>

  <!-- Dial indicator -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="26" height="18" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <circle cx="13" cy="9" r="5" fill="#374151"/>
    <line x1="0" y1="18" x2="-40" y2="70" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="-40" y1="70" x2="-100" y2="70" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="-90" y="60" fill="#9ca3af" font-size="10">百分表</text>
  </g>

  <!-- Edge finder -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="22" height="16" rx="2" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <circle cx="11" cy="8" r="4" fill="#374151"/>
    <text x="-55" y="-8" fill="#9ca3af" font-size="10">寻边器</text>
  </g>

  <!-- Floating label -->
  <g transform="translate(280, 110)">
    <rect x="0" y="-18" width="70" height="18" rx="3" fill="#7c3aed"/>
    <text x="35" y="-4" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">⚠️ 悬空立装</text>
  </g>

  <!-- Dimensions -->
  <g>
    <!-- R (Y distance half) -->
    <line x1="150" y1="470" x2="540" y2="470" stroke="#60a5fa" stroke-width="1.5"/>
    <polygon points="150,470 156,466 156,474" fill="#60a5fa"/>
    <polygon points="540,470 534,466 534,474" fill="#60a5fa"/>
    <text x="345" y="460" text-anchor="middle" fill="#60a5fa" font-size="12">|Y₁ - Y₂| = 2R</text>

    <circle cx="150" cy="470" r="4" fill="#ef4444"/>
    <text x="140" y="492" text-anchor="end" fill="#ef4444" font-size="10">Y₁</text>
    <circle cx="540" cy="470" r="4" fill="#ef4444"/>
    <text x="550" y="492" fill="#ef4444" font-size="10">Y₂</text>

    <!-- H (Z height) -->
    <line x1="720" y1="130" x2="720" y2="340" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="720,130 716,136 724,136" fill="#10b981"/>
    <polygon points="720,340 716,334 724,334" fill="#10b981"/>
    <text x="732" y="245" fill="#10b981" font-size="12">H</text>

    <!-- center Z formula hint -->
    <text x="400" y="540" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Z 回转中心 = H ± R （注意正负！）</text>
  </g>

  <!-- Coordinate system -->
  <g transform="translate(80, 520)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ef4444" stroke-width="2"/>
    <polygon points="50,0 44,-4 44,4" fill="#ef4444"/>
    <text x="55" y="4" fill="#ef4444" font-size="13" font-weight="600">XC</text>

    <line x1="0" y1="0" x2="0" y2="-45" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-45 -4,-39 4,-39" fill="#10b981"/>
    <text x="-18" y="-48" fill="#10b981" font-size="13" font-weight="600">ZC</text>

    <line x1="0" y1="0" x2="-35" y2="25" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="-35,25 -29,21 -31,29" fill="#3b82f6"/>
    <text x="-55" y="32" fill="#3b82f6" font-size="13" font-weight="600">YC</text>

    <circle cx="0" cy="0" r="3" fill="#e5e7eb"/>
    <text x="0" y="20" text-anchor="middle" fill="#9ca3af" font-size="10">G54</text>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 380)" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="url(#lplate)" rx="1"/>
    <text x="20" y="11" fill="#d1d5db">L 型角板</text>

    <rect x="100" y="0" width="14" height="14" fill="url(#part4)" rx="1"/>
    <text x="120" y="11" fill="#d1d5db">工件（悬空立装）</text>

    <rect x="260" y="0" width="14" height="14" fill="#10b981" rx="1"/>
    <text x="280" y="11" fill="#d1d5db">基准面</text>

    <circle cx="397" cy="7" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="410" y="11" fill="#d1d5db">A 轴旋转方向</text>
  </g>

  <defs>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>